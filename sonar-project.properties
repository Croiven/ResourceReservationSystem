sonar.projectKey=ResourceReservationSystem
sonar.projectName=ResourceReservationSystem
sonar.projectVersion=0.1.0

# Source directories
sonar.sources=frontend/src,backend/src
sonar.tests=frontend/src,backend/src

# Test and coverage
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info

# Exclusions (generated and config files only)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.config.ts,**/*.config.js,**/vite-env.d.ts
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/main.tsx,**/index.ts

# Language settings
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git